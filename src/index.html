<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <div class="app-shell" id="app" data-testid="app-shell">

    <div class="panes">

      <!-- Left pane: compact header + search + session list -->
      <aside class="pane-list" data-testid="pane-list">
        <div class="list-header">
          <div class="list-brand">
            <span class="app-title">Claude Assistant</span>
            <span class="app-profile" id="profile-label" data-testid="profile-label" title="Signed-in profile"></span>
          </div>
          <button class="btn btn-ghost btn-icon" id="btn-theme" data-testid="theme-toggle"
                  title="Toggle light / dark" aria-label="Toggle light / dark theme">🌙</button>
          <button class="btn btn-ghost" id="btn-logout" data-testid="logout">Logout</button>
        </div>
        <div class="list-actions">
          <button class="btn btn-ghost" id="btn-import" data-testid="import-sessions">↥ Import</button>
          <input type="file" id="import-file" data-testid="import-file" accept=".json,application/json" multiple hidden>
        </div>

        <div class="list-search">
          <div class="search-box" role="search">
            <span class="search-icon" aria-hidden="true">🔎</span>
            <input type="search" id="search-input" data-testid="search-input"
                   placeholder="Поиск по сессиям…  ( / )" autocomplete="off" spellcheck="false"
                   aria-label="Поиск по сессиям" aria-describedby="search-count">
            <button type="button" class="search-clear" id="search-clear" data-testid="search-clear"
                    title="Очистить (Esc)" aria-label="Очистить поиск" hidden>✕</button>
          </div>
          <div class="search-count" id="search-count" data-testid="search-count" role="status" aria-live="polite" hidden></div>
          <div class="search-row">
            <select id="project-filter" data-testid="project-filter" aria-label="Filter by project" title="Filter by project">
              <option value="">Все проекты</option>
            </select>
            <button class="btn btn-ghost btn-icon" id="btn-reproject" data-testid="reproject"
                    title="⟳ Переструктурировать проекты (авто-группировка сессий)" aria-label="Переструктурировать проекты">⟳</button>
          </div>
        </div>
        <div id="sessions-list" class="list-scroll" data-testid="sessions-list" role="list"></div>
      </aside>

      <!-- Center pane: conversation (dominant, full height, comfortable width) -->
      <section class="pane-convo" data-testid="pane-convo">

        <!-- Placeholder when nothing selected -->
        <div id="convo-empty" class="convo-empty" data-testid="convo-empty">
          <div class="empty">
            <h3>No session selected</h3>
            <p>Pick a session on the left, or start a new one.</p>
          </div>
        </div>

        <!-- Active conversation -->
        <div id="convo" class="convo hidden">
          <div class="convo-header">
            <button class="nav-back mobile-only" id="btn-back" data-testid="back-to-sessions" aria-label="Back to sessions">←</button>
            <span class="convo-title" id="session-title" data-testid="session-title"></span>
            <span id="session-project-badge" class="session-project-badge hidden" data-testid="session-project-badge"></span>
            <span id="session-status" data-testid="session-status"></span>
          </div>

          <div id="messages-container" class="messages" data-testid="messages"></div>

          <div id="activity-area" class="voice-status hidden" role="status" aria-live="polite" data-testid="activity"></div>
          <div id="stream-area" class="stream-area hidden" data-testid="stream" role="status" aria-live="polite"></div>
          <div id="reconnect-notice" class="reconnect-notice hidden" data-testid="reconnect-notice" role="status" aria-live="polite">Reconnecting…</div>
        </div>

      </section>

      <!-- Right rail: one composer for both New Session and Reply. -->
      <aside class="pane-actions" data-testid="pane-actions">
        <div class="actions-header">
          <button class="btn btn-primary" id="btn-new" data-testid="new-session">+ Новая сессия</button>
        </div>
        <div id="session-context" class="session-context" data-testid="session-context"></div>
        <div class="reply-form">
          <label class="reply-label" id="composer-label" for="reply-input">Ответ в сессию</label>

          <div id="new-session-project" class="new-session-project hidden" data-testid="new-session-project">
            <div class="folder-row">
              <select id="folder-select" data-testid="folder-select" aria-label="Проект новой сессии">
                <option value="">Loading folders…</option>
              </select>
              <button type="button" class="btn btn-ghost" id="btn-new-project" data-testid="new-project"
                      title="Create a new project">＋ New project</button>
            </div>
            <div class="field hidden" id="new-project-form" data-testid="new-project-form">
              <div class="folder-row">
                <input id="new-project-name" data-testid="new-project-name" type="text"
                       placeholder="e.g. recruiting: Backend dev" maxlength="120" />
                <select id="new-project-type" data-testid="new-project-type">
                  <option value="">Generic</option>
                  <option value="recruiting">Recruiting</option>
                  <option value="expo">Exhibition</option>
                </select>
                <button type="button" class="btn btn-primary" id="btn-create-project" data-testid="create-project">Create</button>
              </div>
              <div id="new-project-error" class="hidden" role="alert" data-testid="new-project-error"></div>
            </div>
            <div id="project-notice" class="voice-status hidden" role="status"></div>
            <button type="button" class="btn btn-ghost btn-cancel-new" id="btn-cancel-new" data-testid="cancel-new">Отмена новой сессии</button>
          </div>

          <div id="composer-project" class="session-project hidden" data-testid="composer-project"></div>

          <textarea id="reply-input" data-testid="reply-input" placeholder="Write a reply…  (Ctrl+Enter to send · drag files or paste screenshots)"></textarea>
          <div id="attachments" class="attachments hidden" data-testid="attachments"></div>
          <div id="attach-hint" class="voice-status hidden" data-testid="attach-hint" role="status" aria-live="polite"></div>
          <div id="voice-status" class="voice-status hidden" data-testid="voice-status" role="status" aria-live="polite"></div>
          <div id="composer-notice" class="voice-status hidden" data-testid="composer-notice" role="status" aria-live="polite"></div>
          <div id="reply-buttons" class="reply-buttons">
            <button class="btn btn-ghost" id="btn-attach" data-testid="attach-file" aria-label="Добавить файл">📎 Файл</button>
            <input type="file" id="attach-file" data-testid="file-input" multiple hidden>
            <button class="btn btn-ghost btn-mic" id="btn-mic" data-testid="mic-record" title="Dictate (voice input)" aria-label="Record voice">🎤 Voice</button>
            <button class="btn btn-primary hidden" id="btn-continue" data-testid="continue-session" title="Продолжить эту сессию">▷ Продолжай</button>
            <button class="btn btn-primary btn-send" id="btn-send" data-testid="send-reply">Отправить</button>
          </div>
          <div id="stop-row" class="stop-row">
            <button class="btn btn-danger hidden" id="btn-stop" data-testid="stop-session" title="Остановить выполнение">Остановить выполнение</button>
            <button class="btn btn-warn hidden" id="btn-supplement" data-testid="supplement-session" title="Остановить и перезапустить с текстом из поля ответа">✎ Дополнить</button>
          </div>
          <!-- Swapped in for stop-row/reply-buttons on Стоп/Дополнить click — see
               spec-stop-supplement-confirm: neither action fires on the first
               click, both require this explicit confirm step. -->
          <div id="confirm-panel" class="confirm-panel hidden" data-testid="confirm-panel" role="alertdialog" aria-live="assertive">
            <p id="confirm-text" data-testid="confirm-text"></p>
            <div class="confirm-buttons">
              <button class="btn btn-danger" id="btn-confirm-yes" data-testid="confirm-yes"></button>
              <button class="btn btn-ghost" id="btn-confirm-cancel" data-testid="confirm-cancel"></button>
            </div>
          </div>
        </div>
      </aside>
    </div>

    <!-- Full-window drop target for drag-and-drop file attachments -->
    <div id="drop-overlay" class="drop-overlay hidden" data-testid="drop-overlay" aria-hidden="true">
      <div class="drop-overlay-inner">⇩ Drop files to attach<small>documents &amp; screenshots · max 3MB each</small></div>
    </div>

    <!-- Reproject: restructure the profile's projects automatically -->
    <div id="reproject-modal" class="modal-overlay hidden" data-testid="reproject-modal" role="dialog" aria-modal="true" aria-labelledby="reproject-title">
      <div class="modal-card">
        <div class="modal-header">
          <h3 id="reproject-title" data-testid="reproject-title">⟳ Переструктурировать проекты</h3>
          <button class="btn btn-ghost btn-icon" id="btn-reproject-close" data-testid="reproject-close"
                  title="Закрыть" aria-label="Закрыть">✕</button>
        </div>
        <div id="reproject-body" class="modal-body" data-testid="reproject-body"></div>
        <div id="reproject-actions" class="modal-actions hidden" data-testid="reproject-actions">
          <button class="btn btn-danger" id="btn-reproject-revert" data-testid="reproject-revert">↩ Откатить</button>
          <button class="btn btn-primary" id="btn-reproject-apply" data-testid="reproject-apply">✓ Применить</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
