<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claude Assistant</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
</head>
<body>
  <div class="app-shell" id="app" data-testid="app-shell">

    <!-- Top bar -->
    <header class="topbar">
      <span class="app-title">Claude Assistant</span>
      <div class="topbar-actions">
        <button class="btn btn-ghost" id="btn-logout" data-testid="logout">Logout</button>
      </div>
    </header>

    <div class="panes">

      <!-- Left pane: search + session list -->
      <aside class="pane-list" data-testid="pane-list">
        <div class="list-search">
          <input type="search" id="search-input" data-testid="search-input"
                 placeholder="Search sessions…" autocomplete="off" aria-label="Search sessions">
        </div>
        <div id="sessions-list" class="list-scroll" data-testid="sessions-list" role="list"></div>
      </aside>

      <!-- Center pane: conversation (dominant, full height, comfortable width) -->
      <section class="pane-convo" data-testid="pane-convo">

        <!-- Placeholder when nothing selected -->
        <div id="convo-empty" class="convo-empty" data-testid="convo-empty">
          <div class="empty">
            <h3>No session selected</h3>
            <p>Pick a session on the left, or start a new one.</p>
          </div>
        </div>

        <!-- Active conversation -->
        <div id="convo" class="convo hidden">
          <div class="convo-header">
            <button class="nav-back mobile-only" id="btn-back" data-testid="back-to-sessions" aria-label="Back to sessions">←</button>
            <span class="convo-title" id="session-title" data-testid="session-title"></span>
            <span id="session-status" data-testid="session-status"></span>
          </div>

          <div id="messages-container" class="messages" data-testid="messages"></div>

          <div id="stream-area" class="stream-area hidden" data-testid="stream" role="status" aria-live="polite"></div>
          <div id="reconnect-notice" class="reconnect-notice hidden" data-testid="reconnect-notice" role="status" aria-live="polite">Reconnecting…</div>
        </div>

      </section>

      <!-- Right rail: controls on top, spacious reply below -->
      <aside class="pane-actions" data-testid="pane-actions">
        <div class="actions-bar">
          <button class="btn btn-primary" id="btn-new" data-testid="new-session">+ New</button>
          <button class="btn btn-ghost" id="btn-import" data-testid="import-sessions">↥ Import</button>
          <input type="file" id="import-file" data-testid="import-file" accept=".json,application/json" multiple hidden>
          <button class="btn btn-danger hidden" id="btn-stop" data-testid="stop-session" title="Kill this session">✕ Kill</button>
        </div>

        <div class="reply-form">
          <label class="reply-label" for="reply-input">Reply</label>
          <textarea id="reply-input" data-testid="reply-input" placeholder="Write a reply…  (Ctrl+Enter to send)"></textarea>
          <button class="btn btn-primary btn-send" id="btn-send" data-testid="send-reply">Send</button>
        </div>
      </aside>
    </div>
  </div>

  <!-- New session modal -->
  <div id="modal-new" class="modal-overlay hidden" data-testid="new-session-modal" role="dialog" aria-modal="true" aria-label="New Session">
    <div class="modal">
      <h2>New Session</h2>
      <div class="field">
        <label for="folder-select">Project folder</label>
        <select id="folder-select" data-testid="folder-select">
          <option value="">Loading folders…</option>
        </select>
      </div>
      <div class="field">
        <label for="task-input">Task</label>
        <textarea id="task-input" data-testid="task-input" rows="4" placeholder="Describe what Claude should do…"></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btn-cancel-new" data-testid="cancel-new">Cancel</button>
        <button class="btn btn-primary" id="btn-start-new" data-testid="start-new">Start</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
