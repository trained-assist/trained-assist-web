name = "trained-assist-web"
main = "worker.mjs"
compatibility_date = "2024-11-06"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./src"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "SESSION_HUB"
class_name = "SessionHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionHub"]
