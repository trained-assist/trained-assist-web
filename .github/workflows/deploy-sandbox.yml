name: Deploy sandbox
on:
  workflow_dispatch:
    inputs:
      confirm_sandbox:
        description: Type SANDBOX to deploy the isolated Web Worker
        required: true
        type: string

jobs:
  deploy:
    if: inputs.confirm_sandbox == 'SANDBOX'
    runs-on: ubuntu-latest
    environment:
      name: web-sandbox
      url: https://trained-assist-web-sandbox.skillset-apply.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Run the repository checks before deployment
        run: npm test
      - name: Configure sandbox-only password
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$DEMO_PASSWORD"
          printf '%s' "$DEMO_PASSWORD" | npx wrangler secret put DEMO_PASSWORD --config wrangler.sandbox.toml
      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
          BUILD_SHA: ${{ github.sha }}
        run: npx wrangler deploy --config wrangler.sandbox.toml --var BUILD_SHA:"$BUILD_SHA"
      - name: Smoke exact sandbox revision and authentication
        env:
          DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          SANDBOX_URL: https://trained-assist-web-sandbox.skillset-apply.workers.dev
          BUILD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          health=$(curl -fsS "$SANDBOX_URL/healthz")
          printf '%s' "$health" | grep -q "\"buildSha\":\"$BUILD_SHA\""
          curl -fsS "$SANDBOX_URL/" | grep -q '<html'
          status=$(curl -sS -o /tmp/auth.json -w '%{http_code}' \
            -H 'content-type: application/json' \
            --data '{"password":"invalid-sandbox-password"}' "$SANDBOX_URL/web/auth")
          test "$status" = 401
          echo "Sandbox $BUILD_SHA serves UI and rejects invalid login"
