name: Stale

on:
  schedule:
    - cron: '0 9 * * *'

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 7
          days-before-close: 3
          stale-pr-label: stale
          stale-pr-message: "No activity for 7 days — closing in 3 days unless updated."
          exempt-pr-labels: "do-not-close"
