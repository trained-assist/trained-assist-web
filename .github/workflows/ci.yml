name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate static files
        run: |
          test -f src/index.html
          test -f src/app.js
          echo "Static site check passed"

  auto-merge:
    needs: [check]
    if: success() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Merge if up-to-date
        run: |
          PR=${{ github.event.pull_request.number }}
          BEHIND=$(gh pr view $PR --json behindBy -q .behindBy)
          if [ "$BEHIND" = "0" ]; then
            gh pr merge $PR --squash --delete-branch
          else
            echo "PR is $BEHIND commits behind base — skipping auto-merge (Merge Relay will update)"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
