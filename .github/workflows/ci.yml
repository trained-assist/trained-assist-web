name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Syntax check
        run: node --check src/app.js

  staging-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - run: npx playwright install --with-deps chromium
      - run: npm run test:staging

  # Auto-merge uses GITHUB_TOKEN, and GitHub never starts a push run for commits
  # pushed by GITHUB_TOKEN — so a push-only deploy silently never ran after #46.
  # Deploy the exact merged main commit from the same PR run that merged it;
  # a human push to main still deploys via the push branch of the condition.
  deploy-production:
    needs: [check, staging-gate, auto-merge]
    if: |
      always() && needs.check.result == 'success' && needs.staging-gate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') || needs.auto-merge.outputs.merged_sha != '')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.trainedassist.store
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.auto-merge.outputs.merged_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --include=dev
      - name: Deploy Cloudflare Worker + static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: npx wrangler deploy --var BUILD_SHA:"${{ needs.auto-merge.outputs.merged_sha || github.sha }}"
      - name: Smoke exact deployed revision and UI architecture
        env:
          BUILD_SHA: ${{ needs.auto-merge.outputs.merged_sha || github.sha }}
          APP_URL: https://app.trainedassist.store
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do
            health=$(curl -fsS "$APP_URL/healthz" 2>/dev/null || true)
            html=$(curl -fsS "$APP_URL/" 2>/dev/null || true)
            if printf '%s' "$health" | grep -q "\"buildSha\":\"$BUILD_SHA\"" \
              && printf '%s' "$html" | grep -q 'data-testid="new-session"' \
              && ! printf '%s' "$html" | grep -q 'data-testid="create-panel"'; then
              echo "✅ production serves $BUILD_SHA with right-rail New Session"
              exit 0
            fi
            echo "attempt $i: health=$health"
            sleep 5
          done
          echo "❌ production did not serve the expected revision/UI"
          exit 1

  auto-merge:
    needs: [check, staging-gate]
    if: success() && github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged_sha: ${{ steps.merge.outputs.merged_sha }}
    steps:
      - name: Merge if up-to-date
        id: merge
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          BEHIND=$(gh pr view $PR --repo $REPO --json behindBy -q .behindBy 2>/dev/null || echo "0")
          if [ "$BEHIND" = "0" ]; then
            gh pr merge $PR --repo $REPO --squash --delete-branch
            SHA=$(gh pr view $PR --repo $REPO --json state,mergeCommit -q 'select(.state=="MERGED") | .mergeCommit.oid')
            echo "merged_sha=$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "PR is $BEHIND commits behind — Merge Relay will update"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  autofix:
    needs: [check]
    if: |
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      needs.check.result == 'failure' &&
      !startsWith(github.head_ref, 'fix/ci-')
    permissions:
      contents: write
      pull-requests: write
    uses: trained-assist/pr-autofix/.github/workflows/autofix-callable.yml@v1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      original_branch: ${{ github.head_ref }}
      run_id: ${{ github.run_id }}
    secrets:
      openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
      gh_token: ${{ secrets.AUTOFIX_PAT || github.token }}
